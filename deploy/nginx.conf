# nginx site for the tracker. Replace the domain and certificate paths, then:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/project-tracker
#   sudo ln -s /etc/nginx/sites-available/project-tracker /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# For a free certificate: sudo certbot --nginx -d tracker.your-test-domain.webel.io

server {
    listen 80;
    server_name tracker.your-test-domain.webel.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tracker.your-test-domain.webel.io;

    ssl_certificate     /etc/letsencrypt/live/tracker.your-test-domain.webel.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracker.your-test-domain.webel.io/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # a full CRM sync can take a while
        # The app uses X-Real-IP to lock out repeated wrong passwords per address.
    }
}
