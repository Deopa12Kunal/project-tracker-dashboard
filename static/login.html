<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Project Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
<main class="login-box">
  <h1>Project Status, AMC &amp; Domain Tracker</h1>
  <p class="sub">Webelio internal dashboard. Sign in with your company Google account.</p>
  <p class="login-error" id="err" role="alert" hidden></p>
  <a class="btn primary login-btn" href="/auth/login">Sign in with Google</a>
  <p class="note">Only @webel.io accounts can sign in.</p>
</main>
<script>
  const msgs = {
    domain: "That Google account isn't a company account. Sign in with your @webel.io address.",
    notallowed: "Your account hasn't been given access to this dashboard. Ask the admin to add you.",
    state: "The sign-in took too long or was opened in another tab. Please try again.",
    cancelled: "Sign-in was cancelled.",
    google: "Google sign-in failed. Please try again, or contact the admin if it keeps happening.",
  };
  const code = new URLSearchParams(location.search).get("error");
  if (code) { const el = document.getElementById("err"); el.textContent = msgs[code] || msgs.google; el.hidden = false; }
  try { const th = localStorage.getItem("ptd.theme"); if (th) document.documentElement.dataset.theme = th; } catch {}
</script>
</body>
</html>
